<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Board Prep — BIEK Class 12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─── */
:root{
  --bg:#f8fafc;--bg2:#f1f5f9;--card:#ffffff;--bd:#e2e8f0;--bd2:#cbd5e1;
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --g:linear-gradient(135deg,#14b8a6 0%,#10b981 100%);
  --gt:#0f766e;--gts:#10b981;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shh:0 20px 40px -12px rgba(16,185,129,.25),0 4px 12px rgba(0,0,0,.06);
  --r:14px;--r2:10px;--r3:8px;
  --nav:56px;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0b0f14;--bg2:#111620;--card:#161d28;--bd:#1e2a3a;--bd2:#263547;
    --tx:#f0f6ff;--tx2:#8ba0b8;--tx3:#4a6075;
    --sh:none;--shh:0 20px 40px -12px rgba(16,185,129,.22),0 0 0 1px rgba(20,184,166,.18);
  }
}
:root[data-theme=dark]{
  --bg:#0b0f14;--bg2:#111620;--card:#161d28;--bd:#1e2a3a;--bd2:#263547;
  --tx:#f0f6ff;--tx2:#8ba0b8;--tx3:#4a6075;
  --sh:none;--shh:0 20px 40px -12px rgba(16,185,129,.22),0 0 0 1px rgba(20,184,166,.18);
}

/* ─── RESET ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--nav) + env(safe-area-inset-top,0px) + 8px)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,h4{letter-spacing:-0.03em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
ul{list-style:none}
svg{display:block;flex-shrink:0}

/* ─── LAYOUT ─── */
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
@media(min-width:768px){.wrap{padding:0 32px}}
.grid-1{display:grid;grid-template-columns:1fr;gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:639px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
@media(min-width:640px) and (max-width:767px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:768px) and (max-width:1023px){.grid-4{grid-template-columns:repeat(2,1fr)}}

/* ─── TOPBAR ─── */
#topbar{
  position:sticky;top:0;left:0;right:0;z-index:100;height:var(--nav);
  padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;
}
.topbar-inner{display:flex;align-items:center;gap:12px;width:100%}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-0.03em;flex-shrink:0}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--g);display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px -3px rgba(16,185,129,.7)}
.nav-pills{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;-webkit-overflow-scrolling:touch;padding:2px 0}
.nav-pills::-webkit-scrollbar{display:none}
.npill{
  flex-shrink:0;padding:6px 12px;border-radius:7px;border:0;background:transparent;
  color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:color .2s,background .2s,transform .12s;
}
.npill:hover{color:var(--tx);background:var(--bg2)}
.npill:active{transform:scale(.96)}
.npill.active{color:var(--tx);background:var(--bg2);box-shadow:inset 0 0 0 1px var(--bd2)}
.topbar-actions{display:flex;gap:6px;flex-shrink:0}

/* ─── BUTTONS ─── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--r3);border:1px solid var(--bd);
  background:var(--card);color:var(--tx);font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap;letter-spacing:-0.01em;
  transition:transform .14s,background .2s,border-color .2s,box-shadow .2s,filter .2s,color .2s;
  box-shadow:var(--sh);
}
.btn:hover{background:var(--bg2);border-color:var(--bd2)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid #10b981;outline-offset:2px}
.btn-icon{padding:8px;border-radius:8px}
.btn-p{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 4px 14px -4px rgba(16,185,129,.55)}
.btn-p:hover{filter:brightness(1.08);box-shadow:0 8px 22px -6px rgba(16,185,129,.7);background:var(--g)}
.btn-glass{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);backdrop-filter:blur(8px)}
.btn-glass:hover{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.55)}
.btn-danger{background:rgba(239,68,68,.1);color:#ef4444;border-color:rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.18)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}

/* ─── CARDS ─── */
.card{
  background:var(--card);border:1px solid var(--bd);border-radius:var(--r);
  box-shadow:var(--sh);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s,opacity .3s,background .3s;
}
.card-lift:hover{transform:translateY(-4px);box-shadow:var(--shh);border-color:rgba(20,184,166,.4)}

/* ─── HERO ─── */
#hero{
  position:relative;overflow:hidden;border-radius:20px;
  background:linear-gradient(135deg,#0d9488 0%,#059669 45%,#10b981 100%);
  color:#fff;padding:28px 24px;
}
.hero-glow1{position:absolute;top:-40%;left:-10%;width:70%;height:170%;background:radial-gradient(ellipse,rgba(255,255,255,.2),transparent 60%);animation:slowSpin 22s linear infinite;pointer-events:none}
.hero-glow2{position:absolute;bottom:-30%;right:-5%;width:55%;height:130%;background:radial-gradient(ellipse,rgba(255,255,255,.12),transparent 55%);animation:slowSpin 18s linear infinite reverse;pointer-events:none}
@keyframes slowSpin{to{transform:rotate(360deg)}}
.hero-content{position:relative;z-index:1}
.hero-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.hero-title{font-size:12px;font-weight:600;opacity:.8;text-transform:none;letter-spacing:0;margin-bottom:4px}
.hero-exam{font-size:clamp(18px,4vw,24px);font-weight:700;letter-spacing:-0.04em}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.cd-grid{display:flex;gap:8px;margin-top:20px;max-width:400px}
.cd-unit{
  flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);
  border-radius:12px;padding:10px 6px 8px;text-align:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:56px;
}
.cd-num{
  display:block;font-size:clamp(24px,6vw,34px);font-weight:800;line-height:1;
  letter-spacing:-0.06em;font-variant-numeric:tabular-nums;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s;
}
.cd-num.flip{animation:cdFlip .3s cubic-bezier(.2,.8,.2,1)}
@keyframes cdFlip{0%{transform:translateY(-7px);opacity:.3}100%{transform:none;opacity:1}}
.cd-label{font-size:11px;opacity:.78;font-weight:500;margin-top:2px;display:block}
.hero-bar-row{margin-top:18px;max-width:480px}
.hero-bar-label{display:flex;justify-content:space-between;font-size:12px;font-weight:500;margin-bottom:6px;opacity:.9}
.hero-bar-track{height:7px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.hero-bar-fill{height:100%;width:0;border-radius:99px;background:#fff;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

/* ─── STAT CARDS ─── */
.stat-icon{width:36px;height:36px;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px -4px rgba(16,185,129,.6)}
.stat-num{font-size:28px;font-weight:700;letter-spacing:-0.05em;line-height:1;font-variant-numeric:tabular-nums;margin:10px 0 2px}
.stat-label{font-size:13px;font-weight:500;color:var(--tx)}
.stat-sub{font-size:12px;color:var(--tx2);margin-top:1px}

/* ─── PROGRESS BARS ─── */
.pbar-track{height:7px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:10px}
.pbar-fill{height:100%;width:0;border-radius:99px;background:var(--g);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

/* ─── BADGES ─── */
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.badge-green{background:rgba(16,185,129,.14);color:#059669}
.badge-yellow{background:rgba(245,158,11,.14);color:#d97706}
.badge-red{background:rgba(239,68,68,.13);color:#dc2626}
.badge-blue{background:rgba(59,130,246,.13);color:#2563eb}
:root[data-theme=dark] .badge-green{background:rgba(16,185,129,.18);color:#34d399}
:root[data-theme=dark] .badge-yellow{background:rgba(245,158,11,.18);color:#fbbf24}
:root[data-theme=dark] .badge-red{background:rgba(239,68,68,.18);color:#f87171}
:root[data-theme=dark] .badge-blue{background:rgba(59,130,246,.18);color:#60a5fa}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]) .badge-green{background:rgba(16,185,129,.18);color:#34d399}
  :root:not([data-theme=light]) .badge-yellow{background:rgba(245,158,11,.18);color:#fbbf24}
  :root:not([data-theme=light]) .badge-red{background:rgba(239,68,68,.18);color:#f87171}
  :root:not([data-theme=light]) .badge-blue{background:rgba(59,130,246,.18);color:#60a5fa}
}

/* ─── SECTION HEADER ─── */
.sec-header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sec-title{font-size:18px;font-weight:700}
.sec-sub{font-size:13px;color:var(--tx2);margin-top:2px}

/* ─── FILTER CHIPS ─── */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{
  padding:5px 13px;border-radius:99px;border:1px solid var(--bd);
  background:var(--card);color:var(--tx2);font-size:12.5px;font-weight:500;
  cursor:pointer;transition:all .18s;box-shadow:var(--sh);
}
.chip:hover{color:var(--tx);border-color:var(--bd2);background:var(--bg2)}
.chip:active{transform:scale(.96)}
.chip.active{color:#10b981;border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.08)}

/* ─── CHAPTER CARD ─── */
.ch-card{padding:16px}
.ch-subj{font-size:11px;font-weight:600;margin-bottom:3px}
.ch-name{font-size:14px;font-weight:600;margin-bottom:2px}
.ch-meta{font-size:11.5px;color:var(--tx2);margin-bottom:4px}
.ch-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.ch-actions{display:flex;gap:6px}

/* ─── TEST CARD ─── */
.test-card{padding:16px}
.test-header{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.test-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.test-name{font-size:14px;font-weight:600;line-height:1.3}
.test-meta{font-size:11.5px;color:var(--tx2);margin-top:2px}
.test-scores{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.test-num{font-size:26px;font-weight:700;letter-spacing:-0.05em;line-height:1}
.test-den{font-size:14px;color:var(--tx2);font-weight:500}

/* ─── LOG TABLE ─── */
.log-row{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-bottom:1px solid var(--bd);transition:background .18s;
}
.log-row:last-child{border-bottom:none}
.log-row:hover{background:var(--bg2)}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.log-topic{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-dur{font-size:12px;font-weight:600;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.log-date{font-size:11.5px;color:var(--tx3);white-space:nowrap}

/* ─── CHAT ─── */
#chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - calc(var(--nav) + env(safe-area-inset-top,0px) + 140px));min-height:420px;max-height:680px}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;scroll-behavior:smooth;display:flex;flex-direction:column;gap:14px}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
.chat-input-row{padding:10px 12px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center}
.chat-input{
  flex:1;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);
  background:var(--bg2);color:var(--tx);outline:none;font-size:14px;
  transition:border-color .2s,box-shadow .2s;
}
.chat-input:focus{border-color:rgba(20,184,166,.6);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.chat-suggestions{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}
.msg-row{display:flex;gap:10px;align-items:flex-start}
.msg-row.user{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:8px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.msg-av.user{background:var(--bg2);border:1px solid var(--bd)}
.msg-bub{
  max-width:min(80%,520px);padding:10px 14px;border-radius:16px;line-height:1.55;font-size:13.5px;
  animation:bubIn .3s cubic-bezier(.2,.8,.2,1) both;
}
.msg-row.ai .msg-bub{background:var(--bg2);border-top-left-radius:4px}
.msg-row.user .msg-bub{background:var(--g);color:#fff;border-top-right-radius:4px}
@keyframes bubIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--tx2);display:inline-block;margin:0 2px;animation:tdot 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-5px);opacity:1}}

/* ─── MODAL ─── */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:grid;place-items:center;padding:16px;
  opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;
}
.overlay.open{opacity:1;visibility:visible}
.modal{
  width:100%;max-width:420px;padding:22px;
  transform:scale(.94) translateY(8px);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.overlay.open .modal{transform:none}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:700}
.form-group{display:grid;gap:5px;margin-bottom:12px}
.form-label{font-size:12px;font-weight:500;color:var(--tx2)}
.form-input,.form-select{
  padding:9px 12px;border-radius:var(--r3);border:1px solid var(--bd);
  background:var(--bg2);color:var(--tx);width:100%;outline:none;font-size:14px;
  transition:border-color .2s,box-shadow .2s;
}
.form-input:focus,.form-select:focus{border-color:rgba(20,184,166,.6);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* ─── TOAST ─── */
#toast-root{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
.toast{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--bd);
  padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:500;
  box-shadow:0 14px 32px -10px rgba(0,0,0,.32);
  pointer-events:all;
  animation:toastIn .4s cubic-bezier(.2,.8,.2,1) both;max-width:320px;
}
.toast.out{animation:toastOut .32s ease forwards}
.toast-icon{width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;flex-shrink:0}
.toast.error .toast-icon{background:#ef4444}
@keyframes toastIn{from{transform:translateX(calc(100% + 20px));opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateX(calc(100% + 20px));opacity:0}}

/* ─── SKELETON ─── */
.skel{border-radius:8px;background:linear-gradient(90deg,var(--bg2) 25%,var(--bd) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ─── EMPTY STATE ─── */
.empty{padding:60px 20px;text-align:center}
.empty-icon{width:88px;height:88px;border-radius:22px;background:var(--g);color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-size:40px;animation:floatY 3.5s ease-in-out infinite}
@keyframes floatY{50%{transform:translateY(-8px)}}
.empty-title{font-size:17px;font-weight:700;margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--tx2);max-width:260px;margin:0 auto 20px}

/* ─── FADE-UP ANIMATION ─── */
.fu{opacity:0;animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d,0) * 1ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ─── MISC ─── */
.del-btn{opacity:0;transition:opacity .2s}
.card:hover .del-btn,.log-row:hover .del-btn{opacity:1}
@media(hover:none){.del-btn{opacity:1}}
.dying{opacity:0;transform:scale(.95);transition:opacity .25s,transform .25s}
.p-4{padding:16px}
.p-5{padding:20px}
.hidden{display:none!important}
.mu{color:var(--tx2)}
.tab-panel{display:none}
.tab-panel.active{display:block}
hr.divider{border:none;border-top:1px solid var(--bd);margin:0}

/* ─── REDUCED MOTION ─── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<header id="topbar">
  <div class="wrap topbar-inner">
    <div class="logo">
      <div class="logo-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <span>My Board Prep</span>
    </div>
    <nav class="nav-pills" id="nav-pills"></nav>
    <div class="topbar-actions">
      <button class="btn btn-icon" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"></button>
      <button class="btn btn-p btn-sm" id="header-log-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Log session
      </button>
    </div>
  </div>
</header>

<!-- MAIN -->
<main id="main" class="wrap" style="padding-top:24px;padding-bottom:40px"></main>

<!-- TOAST ROOT -->
<div id="toast-root"></div>

<!-- MODAL -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal card" id="modal-box"></div>
</div>

<script>
/* ═══════════════════════════════════════════
   DATA
═══════════════════════════════════════════ */

/* ═══════════════════════════════════════════
   COUNT-UP
═══════════════════════════════════════════ */
function countUp(el) {
  const to = parseFloat(el.dataset.to);
  const dec = parseInt(el.dataset.dec||'0');
  const suf = el.dataset.suf||'';
  const t0 = performance.now();
  function frame(t) {
    const p = Math.min((t-t0)/1200, 1);
    const ease = 1 - Math.pow(1-p,4);
    el.textContent = (to*ease).toFixed(dec) + suf;
    if(p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function runCountUps() { $$('[data-cu]').forEach(el => countUp(el)); }

/* ═══════════════════════════════════════════
   COUNTDOWN
═══════════════════════════════════════════ */
const cdPrev = {};
function tickCountdown() {
  const diff = EXAM_DATE - Date.now();
  const vals = {
    d: Math.max(0,Math.floor(diff/864e5)),
    h: Math.max(0,Math.floor(diff/36e5)%24),
    m: Math.max(0,Math.floor(diff/6e4)%60),
    s: Math.max(0,Math.floor(diff/1e3)%60)
  };
  for(const k in vals) {
    const el = document.getElementById('cd-'+k);
    if(!el) continue;
    const v = String(vals[k]).padStart(2,'0');
    if(cdPrev[k] !== v) {
      el.textContent = v;
      el.classList.remove('flip');
      void el.offsetWidth;
      el.classList.add('flip');
      cdPrev[k] = v;
    }
  }
}
setInterval(tickCountdown, 1000);

═══════════════════════════════════════════ */
function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = 'toast' + (type==='error'?' error':'');
  el.innerHTML = `<div class="toast-icon">${type==='error'?I.x:I.check}</div><span>${esc(msg)}</span>`;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 350);
  }, 3000);
}

              <span class="test-num">${t.score}</span>
              <span class="test-den">/${t.total}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="badge ${scoreBadge(p)}">${p}%</span>
              <button class="btn btn-sm btn-danger del-btn" data-action="del-test" data-i="${i}">${I.trash}</button>
            </div>
          </div>
          <div class="pbar-track" style="margin-top:10px"><div class="pbar-fill" data-w="${p}"></div></div>
        </div>`;}).join('')}
    </div>`}`;
}

function viewLog() {
  const hrs = (totalMins()/60).toFixed(1);
  return `
    <div class="sec-header ${fuAttr(0)}">
      <div>
        <div class="sec-title">Study Log</div>
        <div class="sec-sub">${hrs} hours across ${S.log.length} sessions</div>
      </div>
      <button class="btn btn-p" data-action="open-session">${I.plus} Log session</button>
    </div>
    ${S.log.length===0 ? `<div class="empty card"><div class="empty-icon">📓</div><div class="empty-title">Nothing logged yet</div><div class="empty-sub">Start tracking your sessions to build a study streak.</div><button class="btn btn-p" data-action="open-session">${I.plus} Log session</button></div>` :
    `<div class="card ${fuAttr(1)}" style="overflow:hidden">
      ${S.log.map((l,i)=>{
        const sb=subj(l.s);
        return `<div class="log-row" data-log-idx="${i}">
          <div class="log-dot" style="background:${sb.color}"></div>
          <div style="min-width:0;flex:1">
            <div class="log-topic">${esc(l.t)}</div>
            <div style="font-size:11.5px;color:var(--tx2)">${l.s}</div>
          </div>
          <div class="log-date">${l.d}</div>
          <div class="log-dur">${l.m}m</div>
          <button class="btn btn-icon del-btn" data-action="del-log" data-i="${i}" style="padding:5px" aria-label="Delete">${I.trash}</button>
        </div>`;}).join('')}
    </div>`}`;
}

function viewTutor() {
  const msgs = S.chatHistory.map(m=>`
    <div class="msg-row ${m.role==='ai'?'ai':'user'}">
      ${m.role==='ai'?`<div class="msg-av">AI</div>`:''}
      <div class="msg-bub">${esc(m.text)}</div>
      ${m.role==='user'?`<div class="msg-av user" style="font-size:16px">🧑</div>`:''}
    </div>`).join('');

  return `
    <div class="sec-header ${fuAttr(0)}">
      <div>
        <div class="sec-title">AI Tutor</div>
        <div class="sec-sub">Powered by your syllabus data</div>
      </div>
    </div>
    <div class="card ${fuAttr(1)}" id="chat-wrap">
      <div class="chat-msgs" id="chat-msgs">${msgs}</div>
      <div class="chat-suggestions">
        ${['Plan my revision week','Explain integration','Which subject needs work?','Best approach for past papers'].map(q=>`
          <button class="chip" data-action="chat-suggest" data-v="${q}">${q}</button>`).join('')}
      </div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-input" placeholder="Ask about any topic, paper strategy, or revision tips…" autocomplete="off">
        <button class="btn btn-p btn-icon" id="chat-send" aria-label="Send">${I.send}</button>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════
   AI TUTOR RESPONSES
═══════════════════════════════════════════ */
function aiReply(q) {
  const low = q.toLowerCase();
  const weak = SUBJECTS.map(s=>({...s,avg:subjectAvg(s.name)})).sort((a,b)=>a.avg-b.avg)[0];
  const strong = SUBJECTS.map(s=>({...s,avg:subjectAvg(s.name)})).sort((a,b)=>b.avg-a.avg)[0];

  if(/plan|schedule|week|routine|timetable/i.test(q))
    return `Here's a focused 7-day plan based on your data:\n\n${SUBJECTS.slice(0,7).map((s,i)=>`Day ${i+1}: ${s.icon} ${s.name} — ${subjectAvg(s.name)<60?'Deep revision (2h)':'Maintenance review (1h)'}`).join('\n')}\n\nEnd each session with 20 minutes of active recall. Your weakest area right now is ${weak.name} at ${weak.avg}% — prioritise it.`;
  if(/integrat|calculus|math|mathematics/i.test(q))
    return `For BIEK Integration:\n\n1. Start with standard forms — memorise the 12 basic integrals.\n2. Practice substitution (u-substitution) daily with 5 problems.\n3. Integration by parts: use LIATE rule to choose u and dv.\n4. Do past papers from 2018–2024 — BIEK repeats question patterns.\n\nYour Mathematics coverage is currently ${subjectAvg('Mathematics')}%.`;
  if(/physics|electro|optic|magnet/i.test(q))
    return `Physics BIEK strategy:\n\n• Electrostatics & Current Electricity = 35% of marks. Focus here first.\n• Draw every circuit diagram by hand — examiners reward neat work.\n• Derive all 8 core formulae from first principles once a week.\n• Your current Physics average is ${subjectAvg('Physics')}% — ${subjectAvg('Physics')<60?'needs urgent attention.':'on the right track.'}`;
  if(/test|mock|score|result|marks/i.test(q))
    return `Your test analysis:\n\n• Average score: ${avgScore()}%\n• Strongest test: ${S.tests.length?S.tests.slice().sort((a,b)=>pct(b)-pct(a))[0].n:'—'}\n• For each lost mark, tag it: concept gap, silly mistake, or time pressure. Fix concept gaps first — they give the biggest return.`;
  if(/weak|low|worst|bad|struggle/i.test(q))
    return `Your weakest subject based on chapter progress is ${weak.name} at ${weak.avg}% coverage.\n\nRecommended action: Dedicate the first 60 minutes of each study day to ${weak.name} for the next 2 weeks. Use active recall: close your notes and write everything you remember after each session.`;
  if(/strong|best|good|highest/i.test(q))
    return `Your strongest subject is ${strong.name} at ${strong.avg}% coverage.\n\nMaintain it with 30-minute weekly reviews. Use that confidence to tackle ${weak.name} — knowing you're strong somewhere helps mentally.`;
  if(/stress|nervous|anxi|tired|overwhelm/i.test(q))
    return `This feeling is completely normal before boards. A few evidence-based tips:\n\n• 50-minute focus, 10-minute break (Pomodoro)\n• Sleep 7–8 hours — memory consolidates during sleep\n• Write down 3 things you revised well each evening\n• One day at a time: just today's plan matters today.`;
  if(/urdu|nazm|nasr|poetry/i.test(q))
    return `Urdu BIEK tips:\n\n• Nazm: memorise the poet's name, era, and central theme. Write one sentence summaries.\n• Nasr: focus on textbook passages — BIEK rarely goes outside prescribed text.\n• Practise writing in clear Nastaleeq-style Urdu, even if on a keyboard.\n• Your Urdu coverage: ${subjectAvg('Urdu')}%.`;
  if(/islamiyat|islam|seerat|quran/i.test(q))
    return `Islamiyat is highly scorable in BIEK!\n\n• Quran passages: revise the Arabic text + Urdu translation together.\n• Seerat: use a timeline — key events, dates, and their significance.\n• Ethics questions: give balanced, well-structured answers with Quranic references.\n• Current coverage: ${subjectAvg('Islamiyat')}% — keep it up!`;
  if(/pakistan studies|pak studies|pakistan|geography/i.test(q))
    return `Pakistan Studies BIEK strategy:\n\n• History: make a year-by-year timeline from 1940–present. BIEK loves chronological questions.\n• Geography: practise map work — river systems, provinces, and climate zones are common.\n• Use mnemonics for government ministries and development plans.\n• Your coverage: ${subjectAvg('Pakistan Studies')}%.`;
  return `Good question! For BIEK Class 12, the most reliable strategy is: revise a topic, close the book, and then try to write/explain everything you remember — that forces real understanding.\n\nWant me to help with a specific chapter, a past paper question, or a revision plan for a subject? Just ask!`;
}

function sendChat(text) {
  const q = (text || document.getElementById('chat-input')?.value || '').trim();
  if(!q) return;
  const inp = document.getElementById('chat-input');
  if(inp) inp.value = '';
  S.chatHistory.push({ role:'user', text:q });
  const msgs = document.getElementById('chat-msgs');
  if(!msgs) return;
  msgs.insertAdjacentHTML('beforeend',`
    <div class="msg-row user">
      <div class="msg-bub">${esc(q)}</div>
      <div class="msg-av user" style="font-size:16px">🧑</div>
    </div>`);
  msgs.insertAdjacentHTML('beforeend',`
    <div class="msg-row ai" id="typing-row">
      <div class="msg-av">AI</div>
      <div class="msg-bub"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
    </div>`);
  msgs.scrollTop = msgs.scrollHeight;

  setTimeout(() => {
    const tr = document.getElementById('typing-row');
    if(tr) tr.remove();
    const reply = aiReply(q);
    S.chatHistory.push({ role:'ai', text:reply });
    msgs.insertAdjacentHTML('beforeend',`
      <div class="msg-row ai">
        <div class="msg-av">AI</div>
        <div class="msg-bub" id="stream-bub"></div>
      </div>`);
    const bub = document.getElementById('stream-bub');
    const words = reply.split(' ');
    let n=0;
    const t = setInterval(()=>{
      bub.textContent = words.slice(0,++n).join(' ');
      msgs.scrollTop = msgs.scrollHeight;
      if(n>=words.length) clearInterval(t);
    }, 28);
  }, 1100);
}

/* ═══════════════════════════════════════════
   NAVIGATION + RENDER
═══════════════════════════════════════════ */
const TABS = [
  ['dashboard','Dashboard'],
  ['chapters','Chapters'],
  ['tests','Tests'],
  ['log','Study Log'],
  ['tutor','AI Tutor']
];

const seenTabs = {};
let renderToken = 0;

function render() {
  const tab = S.tab;
  const tok = ++renderToken;
  const main = document.getElementById('main');

  if(seenTabs[tab]) {
    flushView(tab);
    return;
  }

  main.innerHTML = skeletonHTML();
  seenTabs[tab] = true;
  setTimeout(() => {
    if(renderToken !== tok) return;
    flushView(tab);
  }, 600);
}

function flushView(tab) {
  const map = { dashboard:viewDashboard, chapters:viewChapters, tests:viewTests, log:viewLog, tutor:viewTutor };
  document.getElementById('main').innerHTML = (map[tab] || viewDashboard)();
  tickCountdown();
  animateBars();
  runCountUps();
  if(tab==='tutor'){
    const m = document.getElementById('chat-msgs');
    if(m) m.scrollTop = m.scrollHeight;
  }
}

function goTab(t) {
  if(t===S.tab) return;
  S.tab = t;
  $$('.npill').forEach(p=>p.classList.toggle('active',p.dataset.v===t));
  window.scrollTo({top:0,behavior:'instant'});
  render();
}

/* ═══════════════════════════════════════════
   BUILD NAV + INIT
═══════════════════════════════════════════ */
document.getElementById('nav-pills').innerHTML = TABS.map(([k,l])=>
  `<button class="npill ${k===S.tab?'active':''}" data-action="goto-tab" data-v="${k}">${l}</button>`
).join('');

/* ═══════════════════════════════════════════
   EVENT DELEGATION
═══════════════════════════════════════════ */
document.addEventListener('click', e => {
  if(e.target === document.getElementById('overlay')) { closeModal(); return; }
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const v = btn.dataset.v;
  const i = parseInt(btn.dataset.i);

  switch(action) {
    case 'goto-tab': goTab(v); break;
    case 'filter':   S.filter=v; render(); break;
    case 'open-session': modalSession(); break;
    case 'open-test':    modalTest(); break;
    case 'close-modal':  closeModal(); break;

    case 'save-session': {
      const s=$('#fm-subj'), tp=$('#fm-topic'), mn=$('#fm-mins');
      if(!s||!mn) break;
      const mins = parseInt(mn.value);
      if(isNaN(mins)||mins<1){toast('Enter a valid duration','error');break;}
      S.log.unshift({ s:s.value, m:mins, t:tp?.value||'Self study', d:'Just now' });
      closeModal(); seenTabs.log=false; seenTabs.dashboard=false;
      toast('Session saved'); if(S.tab==='log'||S.tab==='dashboard') render(); break;
    }
    case 'save-test': {
      const n=$('#fm-tname'), s=$('#fm-tsubj'), sc=$('#fm-score'), to=$('#fm-total');
      if(!n||!s||!sc||!to) break;
      if(!n.value.trim()){toast('Enter a test name','error');break;}
      const score=parseFloat(sc.value), total=parseFloat(to.value);
      if(isNaN(score)||isNaN(total)||total<1){toast('Enter valid scores','error');break;}
      if(score>total){toast('Score cannot exceed total','error');break;}
      S.tests.unshift({ n:n.value.trim(), s:s.value, score, total, d:'Just now' });
      closeModal(); seenTabs.tests=false; seenTabs.dashboard=false;
      toast('Test saved'); if(S.tab==='tests'||S.tab==='dashboard') render(); break;
    }
    case 'ch-inc': {
      if(isNaN(i)) break;
      const n = parseInt(btn.dataset.n)||10;
      S.chapters[i].p = Math.min(100, S.chapters[i].p + n);
      const badge = document.getElementById('chbadge-'+i);
      const bar   = document.getElementById('chbar-'+i);
      const p = S.chapters[i].p;
      if(badge){ badge.textContent=p+'%'; badge.className='badge '+scoreBadge(p); }
      if(bar) bar.style.width=p+'%';
      if(p===100) toast(S.chapters[i].n+' — marked complete! 🎉');
      seenTabs.dashboard=false; break;
    }
    case 'del-ch': {
      if(isNaN(i)) break;
      const card = document.querySelector(`[data-ch-idx="${i}"]`);
      if(card){ card.classList.add('dying'); setTimeout(()=>{ S.chapters.splice(i,1); seenTabs.chapters=false; seenTabs.dashboard=false; if(S.tab==='chapters'||S.tab==='dashboard') render(); },260); }
      toast('Chapter removed'); break;
    }
    case 'del-test': {
      if(isNaN(i)) break;
      const card = btn.closest('.test-card');
      if(card){ card.classList.add('dying'); setTimeout(()=>{ S.tests.splice(i,1); seenTabs.tests=false; seenTabs.dashboard=false; if(S.tab==='tests'||S.tab==='dashboard') render(); },260); }
      toast('Test removed'); break;
    }
    case 'del-log': {
      if(isNaN(i)) break;
      const row = document.querySelector(`[data-log-idx="${i}"]`);
      if(row){ row.classList.add('dying'); setTimeout(()=>{ S.log.splice(i,1); seenTabs.log=false; seenTabs.dashboard=false; if(S.tab==='log'||S.tab==='dashboard') render(); },260); }
      toast('Session removed'); break;
    }
    case 'chat-suggest': sendChat(v); break;
    case 'send-chat': sendChat(); break;
  }
});

document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && e.target.id==='chat-input') sendChat();
});

document.getElementById('theme-btn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme;
  const next = cur==='dark'?'light':'dark';
  applyTheme(next,true);
  toast(next==='dark'?'Dark mode on':'Light mode on');
});
document.getElementById('header-log-btn').addEventListener('click', () => modalSession());

document.getElementById('main').addEventListener('click', e => {
  const sb = e.target.closest('#chat-send');
  if(sb) sendChat();
});

/* ── initial render ── */
render();
</script>
</body>
