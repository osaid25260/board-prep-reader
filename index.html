<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Board Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f8fafc;--bg2:#f1f5f9;--card:#fff;--bd:#e2e8f0;--bd2:#cbd5e1;
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --g:linear-gradient(135deg,#14b8a6 0%,#10b981 100%);
  --primary:#10b981;--danger:#ef4444;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shh:0 20px 40px -12px rgba(16,185,129,.25);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --bg:#0b0f14;--bg2:#111620;--card:#161d28;--bd:#1e2a3a;--bd2:#263547;
  --tx:#f0f6ff;--tx2:#8ba0b8;--tx3:#4a6075;
  --sh:none;--shh:0 20px 40px -12px rgba(16,185,129,.22);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;padding-bottom:var(--safe-bottom)}
h1,h2,h3,h4{letter-spacing:-.03em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.wrap{padding:0 32px}}
.grid-1{display:grid;grid-template-columns:1fr;gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:639px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
@media(min-width:640px) and (max-width:767px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(min-width:768px) and (max-width:1023px){.grid-4{grid-template-columns:repeat(2,1fr)}}

#topbar{position:sticky;top:0;z-index:100;height:56px;padding:var(--safe-top) 0 0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);display:flex;align-items:center}
.topbar-inner{display:flex;align-items:center;gap:10px;width:100%}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;flex-shrink:0}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--g);display:grid;place-items:center;color:#fff;font-size:14px;box-shadow:0 4px 10px -3px rgba(16,185,129,.7)}
.nav-pills{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 0}
.nav-pills::-webkit-scrollbar{display:none}
.npill{flex-shrink:0;padding:6px 11px;border-radius:7px;border:0;background:transparent;color:var(--tx2);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s}
.npill:hover{color:var(--tx);background:var(--bg2)}
.npill:active{transform:scale(.96)}
.npill.active{color:var(--tx);background:var(--bg2);box-shadow:inset 0 0 0 1px var(--bd2)}
.topbar-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;flex-shrink:0;transition:transform .15s}
.topbar-btn:active{transform:scale(.92)}
.topbar-btn svg{width:16px;height:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;box-shadow:var(--sh)}
.btn:hover{background:var(--bg2);border-color:var(--bd2)}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 4px 14px -4px rgba(16,185,129,.55)}
.btn-p:hover{filter:brightness(1.08);background:var(--g)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-icon{padding:8px;border-radius:8px}
.btn-danger{background:rgba(239,68,68,.1);color:#ef4444;border-color:rgba(239,68,68,.2)}
.btn-glass{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);backdrop-filter:blur(8px)}
.btn-glass:hover{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.55)}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s}
.card-lift:hover{transform:translateY(-4px);box-shadow:var(--shh);border-color:rgba(20,184,166,.4)}

#hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,#0d9488 0%,#059669 45%,#10b981 100%);color:#fff;padding:24px 20px}
.hero-glow1,.hero-glow2{position:absolute;pointer-events:none;animation:slowSpin 22s linear infinite}
.hero-glow1{top:-40%;left:-10%;width:70%;height:170%;background:radial-gradient(ellipse,rgba(255,255,255,.2),transparent 60%)}
.hero-glow2{bottom:-30%;right:-5%;width:55%;height:130%;background:radial-gradient(ellipse,rgba(255,255,255,.12),transparent 55%);animation-direction:reverse}
@keyframes slowSpin{to{transform:rotate(360deg)}}
.hero-content{position:relative;z-index:1}
.hero-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.hero-title{font-size:11px;font-weight:600;opacity:.85;margin-bottom:3px}
.hero-exam{font-size:clamp(16px,4vw,22px);font-weight:700}
.hero-actions{display:flex;gap:6px;flex-wrap:wrap}
.cd-grid{display:flex;gap:6px;margin-top:18px;max-width:400px}
.cd-unit{flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:11px;padding:9px 5px 7px;text-align:center;backdrop-filter:blur(8px);min-width:52px}
.cd-num{display:block;font-size:clamp(22px,6vw,32px);font-weight:800;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.cd-num.flip{animation:cdFlip .3s cubic-bezier(.2,.8,.2,1)}
@keyframes cdFlip{0%{transform:translateY(-6px);opacity:.3}100%{transform:none;opacity:1}}
.cd-label{font-size:10px;opacity:.8;font-weight:500;margin-top:2px;display:block}
.hero-bar-row{margin-top:16px;max-width:480px}
.hero-bar-label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:500;margin-bottom:5px;opacity:.9}
.hero-bar-track{height:7px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.hero-bar-fill{height:100%;width:0;border-radius:99px;background:#fff;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

.stat-icon{width:34px;height:34px;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px -4px rgba(16,185,129,.6)}
.stat-num{font-size:26px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;margin:8px 0 2px}
.stat-label{font-size:12.5px;font-weight:500}
.stat-sub{font-size:11.5px;color:var(--tx2);margin-top:1px}
.pbar-track{height:7px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:9px}
.pbar-fill{height:100%;width:0;border-radius:99px;background:var(--g);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}

.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.badge-green{background:rgba(16,185,129,.14);color:#059669}
.badge-yellow{background:rgba(245,158,11,.14);color:#d97706}
.badge-red{background:rgba(239,68,68,.13);color:#dc2626}
[data-theme=dark] .badge-green{background:rgba(16,185,129,.18);color:#34d399}
[data-theme=dark] .badge-yellow{background:rgba(245,158,11,.18);color:#fbbf24}
[data-theme=dark] .badge-red{background:rgba(239,68,68,.18);color:#f87171}

.sec-header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-title{font-size:17px;font-weight:700}
.sec-sub{font-size:12.5px;color:var(--tx2);margin-top:2px}
.chip-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx2);font-size:12px;font-weight:500;cursor:pointer;transition:all .18s}
.chip:hover{color:var(--tx);border-color:var(--bd2)}
.chip:active{transform:scale(.96)}
.chip.active{color:#10b981;border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.08)}
.ch-card{padding:14px}
.ch-subj{font-size:10.5px;font-weight:600;margin-bottom:3px}
.ch-name{font-size:13.5px;font-weight:600}
.ch-footer{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:6px}
.test-card{padding:14px}
.test-header{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
.test-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.test-name{font-size:13.5px;font-weight:600;line-height:1.3}
.test-meta{font-size:11px;color:var(--tx2);margin-top:2px}
.test-scores{display:flex;justify-content:space-between;align-items:flex-end;margin-top:7px}
.test-num{font-size:24px;font-weight:700;letter-spacing:-.05em;line-height:1}
.test-den{font-size:13px;color:var(--tx2);font-weight:500}
.log-row{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--bd);transition:background .18s}
.log-row:last-child{border-bottom:none}
.log-row:hover{background:var(--bg2)}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.log-topic{font-size:12.5px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-dur{font-size:11.5px;font-weight:600;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.log-date{font-size:11px;color:var(--tx3);white-space:nowrap}

#chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 200px);min-height:400px;max-height:660px}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-input-row{padding:10px 12px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center}
.chat-input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);outline:none;font-size:14px}
.chat-input:focus{border-color:var(--primary)}
.chat-suggestions{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}
.msg-row{display:flex;gap:9px;align-items:flex-start}
.msg-row.user{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:8px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.msg-av.user{background:var(--bg2);border:1px solid var(--bd)}
.msg-bub{max-width:min(80%,520px);padding:10px 14px;border-radius:14px;line-height:1.55;font-size:13.5px;animation:bubIn .3s cubic-bezier(.2,.8,.2,1) both}
.msg-row.ai .msg-bub{background:var(--bg2);border-top-left-radius:4px}
.msg-row.user .msg-bub{background:var(--g);color:#fff;border-top-right-radius:4px}
@keyframes bubIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--tx2);display:inline-block;margin:0 2px;animation:tdot 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-4px);opacity:1}}

.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.overlay.open{opacity:1;visibility:visible}
.modal{width:100%;max-width:420px;padding:20px;transform:scale(.94);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.overlay.open .modal{transform:none}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:700}
.form-group{display:grid;gap:5px;margin-bottom:11px}
.form-label{font-size:12px;font-weight:500;color:var(--tx2)}
.form-input,.form-select{padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);width:100%;outline:none;font-size:14px}
.form-input:focus,.form-select:focus{border-color:var(--primary)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

#toast-root{position:fixed;right:14px;bottom:calc(20px + var(--safe-bottom));z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
.toast{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);padding:11px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 14px 32px -10px rgba(0,0,0,.32);pointer-events:all;animation:toastIn .4s cubic-bezier(.2,.8,.2,1) both;max-width:320px}
.toast.out{animation:toastOut .32s ease forwards}
.toast-icon{width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;flex-shrink:0;font-size:11px}
.toast.error .toast-icon{background:#ef4444}
@keyframes toastIn{from{transform:translateX(calc(100% + 20px));opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateX(calc(100% + 20px));opacity:0}}

.skel{border-radius:8px;background:linear-gradient(90deg,var(--bg2) 25%,var(--bd) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.empty{padding:50px 20px;text-align:center}
.empty-icon{width:80px;height:80px;border-radius:22px;background:var(--g);color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-size:38px}
.empty-title{font-size:16px;font-weight:700;margin-bottom:6px}
.empty-sub{font-size:12.5px;color:var(--tx2);max-width:260px;margin:0 auto 18px}
.fu{opacity:0;animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d,0) * 1ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.del-btn{opacity:0;transition:opacity .2s}
.card:hover .del-btn,.log-row:hover .del-btn{opacity:1}
@media(hover:none){.del-btn{opacity:1}}
.dying{opacity:0;transform:scale(.95);transition:opacity .25s,transform .25s}

/* LOGIN */
.login-overlay{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .4s,visibility .4s;padding-top:calc(20px + var(--safe-top));padding-bottom:calc(20px + var(--safe-bottom))}
.login-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.login-card{width:100%;max-width:380px;padding:28px 24px;background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:0 20px 60px -12px rgba(16,185,129,.3)}
.login-tab.active{background:var(--primary) !important;color:#fff !important;border-color:var(--primary) !important}
#user-chip{display:none;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;max-width:150px}
#user-chip.show{display:flex}
#user-chip .email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* PDF READER */
#reader-overlay{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
#reader-overlay.open{transform:translateY(0)}
#reader-topbar{display:flex;align-items:center;gap:6px;padding:8px 8px;background:var(--card);border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#reader-topbar::-webkit-scrollbar{display:none}
#reader-title{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rt-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;flex-shrink:0;transition:transform .15s}
.rt-btn:active{transform:scale(.92)}
.rt-btn svg{width:17px;height:17px}
.rt-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
#reader-viewer{flex:1;overflow:auto;background:var(--bg);padding:8px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
#reader-viewer.move-mode{touch-action:pan-x pan-y pinch-zoom}
#reader-viewer.move-mode .draw-canvas{pointer-events:none}
#reader-pages{transition:transform .08s ease-out;transform-origin:0 0}
.pdf-page-wrap{position:relative;margin:0 auto 10px;background:#fff;box-shadow:var(--sh);border-radius:4px;overflow:hidden;display:block;max-width:100%}
.pdf-canvas,.draw-canvas{display:block;max-width:100%;height:auto}
.pdf-canvas{position:relative;z-index:1}
.draw-canvas{position:absolute;top:0;left:0;z-index:2;touch-action:none}
#reader-toolbar{display:flex;align-items:center;gap:5px;padding:8px 8px;background:var(--card);border-top:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#reader-toolbar::-webkit-scrollbar{display:none}
.rtool{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border-radius:11px;border:1px solid transparent;background:var(--bg);color:var(--tx);cursor:pointer;transition:all .15s;position:relative}
.rtool:active{transform:scale(.92)}
.rtool.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px -4px rgba(16,185,129,.6)}
.rtool svg{width:20px;height:20px}
.rsheet{position:fixed;left:0;right:0;bottom:0;z-index:550;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--safe-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:70vh;overflow-y:auto}
.rsheet.open{transform:translateY(0)}
.rsheet-handle{width:40px;height:4px;background:var(--bd);border-radius:99px;margin:0 auto 14px}
.rsheet h3{font-size:14px;font-weight:700;margin-bottom:12px}
.rsheet-backdrop{position:fixed;inset:0;z-index:540;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:all .3s}
.rsheet-backdrop.open{opacity:1;visibility:visible}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.color-swatch{aspect-ratio:1;border-radius:12px;border:3px solid transparent;cursor:pointer;transition:transform .15s}
.color-swatch:active{transform:scale(.9)}
.color-swatch.active{border-color:var(--tx);transform:scale(1.05)}
.size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.size-btn{padding:12px 8px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.size-btn:active{transform:scale(.95)}
.size-btn.active{border-color:var(--primary);background:rgba(16,185,129,.1);color:var(--primary)}
#reader-welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:24px;text-align:center;z-index:10}
#reader-welcome.hidden{display:none}
.rw-icon{width:88px;height:88px;border-radius:24px;background:var(--g);display:grid;place-items:center;color:#fff;font-size:44px;margin-bottom:22px;box-shadow:0 16px 40px -10px rgba(16,185,129,.5);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.rw-title{font-size:22px;font-weight:800;margin-bottom:8px}
.rw-sub{font-size:13.5px;color:var(--tx2);max-width:320px;margin-bottom:24px;line-height:1.6}
#reader-loading{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,23,42,.7);backdrop-filter:blur(8px);z-index:20}
#reader-loading.show{display:flex}
.rspin{width:48px;height:48px;border:4px solid rgba(255,255,255,.2);border-top-color:#10b981;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#reader-loading p{margin-top:16px;color:#fff;font-size:13.5px;font-weight:500}
#reader-toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:600;pointer-events:none;max-width:90vw;text-align:center}
#reader-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bm-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);margin-bottom:7px;cursor:pointer;font-size:13.5px;font-weight:500}
.bm-page{background:var(--primary);color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.bm-del{margin-left:auto;color:var(--danger);padding:6px;cursor:pointer;font-size:16px;line-height:1}
.search-input{width:100%;padding:13px 15px;border:2px solid var(--bd);border-radius:11px;background:var(--bg);color:var(--tx);font-size:15px;outline:none}
.search-input:focus{border-color:var(--primary)}
.search-hit{padding:11px 13px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);margin-bottom:7px;cursor:pointer;font-size:13px;line-height:1.5}
.search-hit b{color:var(--primary)}
.subject-selector{padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:12px;font-weight:600;cursor:pointer;outline:none;max-width:130px;flex-shrink:0}
</style>
</head>

<!-- LOGIN -->

    <button class="rtool" id="reader-zoom" title="Zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>

  </div>
  <div id="reader-welcome">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SUBJECTS = [
  { name:'Computer Science', color:'#3b82f6', icon:'💻' },
  { name:'Physics',          color:'#8b5cf6', icon:'⚛️'  },
  { name:'Mathematics',      color:'#10b981', icon:'📐' },
  { name:'English',          color:'#f59e0b', icon:'📝' },
  { name:'Urdu',             color:'#ec4899', icon:'📖' },
  { name:'Islamiyat',        color:'#14b8a6', icon:'🕌' },
  { name:'Pakistan Studies', color:'#22c55e', icon:'🇵🇰' }
];

const RELEASE_BASE = 'https://github.com/osaid25260/board-prep-reader/releases/download/v2/';
const SUBJECT_PDFS = {
  'Physics':     { file: 'Physics-XII.pdf', label: 'Physics XII' },
  'Mathematics': { file: 'Math-XII.pdf',    label: 'Maths XII' },
  'Urdu':        { file: 'Urdu-XII.pdf',    label: 'Urdu XII' }
};

const EXAM_DATE = new Date();
EXAM_DATE.setDate(EXAM_DATE.getDate() + 61);
EXAM_DATE.setHours(9,0,0,0);

const STORAGE_KEY = 'mbp-state-v1';
const DEFAULT_STATE = {
  tab: 'dashboard', filter: 'All',
  chatHistory: [{ role:'ai', text:"Assalamu Alaikum! I'm your AI tutor for BIEK Class 12. Ask me anything." }],
  chapters: [
    { s:'Computer Science', n:'Binary Number System', p:100 },
    { s:'Computer Science', n:'Boolean Algebra', p:85 },
    { s:'Computer Science', n:'Data Structures', p:60 },
    { s:'Physics', n:'Electrostatics', p:100 },
    { s:'Physics', n:'Current Electricity', p:75 },
    { s:'Physics', n:'Electromagnetism', p:55 },
    { s:'Physics', n:'Ray Optics', p:30 },
    { s:'Mathematics', n:'Calculus', p:90 },
    { s:'Mathematics', n:'Integration', p:70 },
    { s:'Mathematics', n:'Probability', p:50 },
    { s:'English', n:'Comprehension', p:85 },
    { s:'English', n:'Essay Writing', p:65 },
    { s:'Urdu', n:'Nasr (Prose)', p:70 },
    { s:'Urdu', n:'Nazm (Poetry)', p:55 },
    { s:'Islamiyat', n:'Quran & Tafseer', p:90 },
    { s:'Pakistan Studies', n:'History 1947–Present', p:75 }
  ],
  tests: [
    { n:'CS Mock I', s:'Computer Science', score:72, total:100, d:'3 days ago' },
    { n:'Physics Test II', s:'Physics', score:38, total:50, d:'1 week ago' },
    { n:'Maths Quiz', s:'Mathematics', score:28, total:35, d:'1 week ago' }
  ],
  log: [
    { s:'Physics', m:90, t:'Electromagnetism numericals', d:'Today' },
    { s:'Mathematics', m:60, t:'Integration practice', d:'Today' }
  ]
};
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return { ...DEFAULT_STATE, ...JSON.parse(saved) };
  } catch (e) {}
  return { ...DEFAULT_STATE };
}
const S = loadState();

/* AUTH + SYNC */
const API_URL = 'https://skill-barter-api-production-521c.up.railway.app/api';
const TOKEN_KEY = 'mbp-auth-token';
const USER_KEY = 'mbp-auth-user';
let authToken = localStorage.getItem(TOKEN_KEY) || null;
let authUser = null;
let syncTimer = null;
let saveTimeout = null;

function authHeaders() {
  return authToken ? { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
}
async function authAPI(path, options = {}) {
  const res = await fetch(API_URL + path, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.details?.[0]?.message || 'Request failed');
  return data;
}
function saveState() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
    syncSave();
  }, 200);
}
function syncSave() {
  if (!authToken) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await authAPI('/sync', {
        method: 'POST',
        body: JSON.stringify({
          data: { chapters: S.chapters, tests: S.tests, log: S.log, chatHistory: S.chatHistory.slice(-30), lastSaved: new Date().toISOString() }
        })
      });
    } catch (err) { console.warn('Sync failed:', err.message); }
  }, 1500);
}
async function syncLoad() {
  if (!authToken) return;
  try {
    const result = await authAPI('/sync');
    if (result.data && Object.keys(result.data).length) {
      if (result.data.chapters) S.chapters = result.data.chapters;
      if (result.data.tests) S.tests = result.data.tests;
      if (result.data.log) S.log = result.data.log;
      if (result.data.chatHistory) S.chatHistory = result.data.chatHistory;
      toast('☁️ Data sync ho gaya');
    }
  } catch (err) { console.warn('Load failed:', err.message); }
}
function showLogin() {
  $('#login-overlay').classList.remove('hidden');
  $('#user-chip').classList.remove('show');
}
function hideLogin() {
  $('#login-overlay').classList.add('hidden');
  if (authUser) {
    const chip = $('#user-chip');
    chip.classList.add('show');
    chip.querySelector('.email').textContent = authUser.email;
  }
}
document.querySelectorAll('.login-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.login-tab').forEach(x => x.classList.toggle('active', x === t));
    const isReg = t.dataset.ltab === 'register';
    $('#login-name').style.display = isReg ? 'block' : 'none';
    $('#login-submit').textContent = isReg ? 'Create Account' : 'Login';
  });
});
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const tab = document.querySelector('.login-tab.active').dataset.ltab;
  const email = $('#login-email').value.trim();
  const password = $('#login-password').value;
  const name = $('#login-name').value.trim();
  const btn = $('#login-submit');
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Please wait…';
  try {
    const path = tab === 'register' ? '/auth/register' : '/auth/login';
    const result = await authAPI(path, { method: 'POST', body: JSON.stringify({ email, password, name }) });
    authToken = result.token; authUser = result.account;
    localStorage.setItem(TOKEN_KEY, authToken);
    localStorage.setItem(USER_KEY, JSON.stringify(authUser));
    hideLogin();
    await syncLoad();
    toast(tab === 'register' ? '🎉 Account bana!' : '✅ Login ho gaya');
    render();
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false; btn.textContent = orig;
  }
});
$('#user-chip').addEventListener('click', () => {
  if (!confirm('Logout karna hai?')) return;
  authToken = null; authUser = null;
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
  showLogin();
  toast('Logged out');
});

/* HELPERS */
const subj = n => SUBJECTS.find(s=>s.name===n) || {color:'#6b7280',icon:'📚'};
const pct = t => Math.round(t.score/t.total*100);
const scoreBadge = p => p>=80?'badge-green':p>=60?'badge-yellow':'badge-red';
const totalMins = () => S.log.reduce((a,l)=>a+l.m,0);
const avgScore = () => S.tests.length ? Math.round(S.tests.reduce((a,t)=>a+pct(t),0)/S.tests.length) : 0;
const syllPct = () => S.chapters.length ? Math.round(S.chapters.reduce((a,c)=>a+c.p,0)/S.chapters.length) : 0;
const subjectAvg = name => { const c=S.chapters.filter(x=>x.s===name); return c.length?Math.round(c.reduce((a,x)=>a+x.p,0)/c.length):0 };
const doneCh = () => S.chapters.filter(c=>c.p===100).length;
const fuAttr = (i,extra='') => `class="fu ${extra}" style="--d:${i*70}"`;

const I = {
  clock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',

function countUp(el) {
  const to = parseFloat(el.dataset.to);
  const dec = parseInt(el.dataset.dec||'0');
  const suf = el.dataset.suf||'';
  const t0 = performance.now();
  function frame(t) {
    const p = Math.min((t-t0)/1200, 1);
    const ease = 1 - Math.pow(1-p,4);
    el.textContent = (to*ease).toFixed(dec) + suf;
    if(p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function tickCountdown() {
  const diff = EXAM_DATE - Date.now();
  const vals = { d: Math.max(0,Math.floor(diff/864e5)), h: Math.max(0,Math.floor(diff/36e5)%24), m: Math.max(0,Math.floor(diff/6e4)%60), s: Math.max(0,Math.floor(diff/1e3)%60) };
  for(const k in vals) {
    const el = document.getElementById('cd-'+k);
    if(!el) continue;
    const v = String(vals[k]).padStart(2,'0');
    if(cdPrev[k] !== v) { el.textContent = v; el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); cdPrev[k] = v; }
  }
}

function aiReply(q) {
  const weak = SUBJECTS.map(s=>({...s,avg:subjectAvg(s.name)})).sort((a,b)=>a.avg-b.avg)[0];
  if(/plan|week/i.test(q)) return `7-day plan:\n\n${SUBJECTS.slice(0,7).map((s,i)=>`Day ${i+1}: ${s.icon} ${s.name} (${subjectAvg(s.name)}%)`).join('\n')}\n\nWeakest: ${weak.name}`;
  if(/integrat|math/i.test(q)) return `Integration: standard forms → u-sub → by parts (LIATE) → past papers.\n\nMaths: ${subjectAvg('Mathematics')}%`;
  if(/physics/i.test(q)) return `Physics: Electrostatics+Current = 35% marks. Draw diagrams.\n\nPhysics: ${subjectAvg('Physics')}%`;
  if(/weak/i.test(q)) return `Weakest: ${weak.name} at ${weak.avg}%\n\nFirst 60min daily for 2 weeks.`;
  if(/test|score/i.test(q)) return `Average: ${avgScore()}%\nTag lost marks: concept / silly / time.`;
  return `BIEK: revise topic → close book → write from memory. Ask specific chapter!`;
}
function sendChat(text) {

  msgs.scrollTop = msgs.scrollHeight;
  setTimeout(() => {
    $('#typing-row')?.remove();

    msgs.insertAdjacentHTML('beforeend',`<div class="msg-row ai"><div class="msg-av">AI</div><div class="msg-bub" id="stream-bub"></div></div>`);

}

document.addEventListener('click', e => {
  if(e.target === $('#overlay')) { closeModal(); return; }
  const btn = e.target.closest('[data-action]'); if(!btn) return;
  const action = btn.dataset.action, v = btn.dataset.v, i = parseInt(btn.dataset.i);
  switch(action) {
    case 'goto-tab': goTab(v); break;
    case 'filter': S.filter=v; render(); break;
    case 'open-session': modalSession(); break;
    case 'open-test': modalTest(); break;
    case 'close-modal': closeModal(); break;
    case 'save-session': {
      const s=$('#fm-subj'), tp=$('#fm-topic'), mn=$('#fm-mins'); if(!s||!mn) break;
      const mins = parseInt(mn.value);
      if(isNaN(mins)||mins<1){toast('Enter valid duration','error');break;}
      S.log.unshift({ s:s.value, m:mins, t:tp?.value||'Self study', d:'Just now' });
      saveState(); closeModal(); seenTabs.log=false; seenTabs.dashboard=false; toast('Session saved');
      if(S.tab==='log'||S.tab==='dashboard') render(); break;
    }
    case 'save-test': {
      const n=$('#fm-tname'), s=$('#fm-tsubj'), sc=$('#fm-score'), to=$('#fm-total'); if(!n||!s||!sc||!to) break;
      if(!n.value.trim()){toast('Enter test name','error');break;}
      const score=parseFloat(sc.value), total=parseFloat(to.value);
      if(isNaN(score)||isNaN(total)||total<1){toast('Invalid scores','error');break;}
      if(score>total){toast('Score > Total','error');break;}
      S.tests.unshift({ n:n.value.trim(), s:s.value, score, total, d:'Just now' });
      saveState(); closeModal(); seenTabs.tests=false; seenTabs.dashboard=false; toast('Test saved');
      if(S.tab==='tests'||S.tab==='dashboard') render(); break;
    }
    case 'ch-inc': {
      if(isNaN(i)) break;
      const n = parseInt(btn.dataset.n)||10;
      S.chapters[i].p = Math.min(100, S.chapters[i].p + n);
      const badge = document.getElementById('chbadge-'+i), bar = document.getElementById('chbar-'+i);
      const p = S.chapters[i].p;
      if(badge){ badge.textContent=p+'%'; badge.className='badge '+scoreBadge(p); }
      if(bar) bar.style.width=p+'%';
      saveState();
      if(p===100) toast(S.chapters[i].n+' complete! 🎉');
      seenTabs.dashboard=false; break;
    }
    case 'del-ch': { if(isNaN(i)) break;
      const card = document.querySelector(`[data-ch-idx="${i}"]`);
      if(card){ card.classList.add('dying'); setTimeout(()=>{ S.chapters.splice(i,1); saveState(); seenTabs.chapters=false; seenTabs.dashboard=false; if(S.tab==='chapters'||S.tab==='dashboard') render(); },260); }
      toast('Removed'); break;
    }

/* PDF READER */
const readerState = {
  pdfDoc: null, currentPage: 1, totalPages: 0, scale: 1.0,
  tool: 'pen', color: '#ef4444', size: 4, pages: [],
  bookmarks: JSON.parse(localStorage.getItem('reader-bookmarks') || '[]'),
  annotations: JSON.parse(localStorage.getItem('reader-annotations') || '{}'),
  pdfName: localStorage.getItem('reader-pdf-name') || '',
  history: {}, drawing: false, lastX: 0, lastY: 0
};
function rToast(msg) {
  const el = $('#reader-toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200);
}
function openReader() {
  $('#reader-overlay').classList.add('open');
  $$('.npill').forEach(p => p.classList.toggle('active', p.dataset.v === 'book'));
  document.body.style.overflow = 'hidden';

  if (!readerState.pdfDoc) loadSubject(currentSubject);
}
function closeReader() {
  $('#reader-overlay').classList.remove('open');

async function loadPDF(source, name) {
  $('#reader-loading').classList.add('show');
  $('#reader-loading-text').textContent = 'Loading PDF…';
  try {
    const pdf = await pdfjsLib.getDocument(source).promise;
    readerState.pdfDoc = pdf; readerState.totalPages = pdf.numPages; readerState.currentPage = 1;
    readerState.pdfName = name || 'Document';
    localStorage.setItem('reader-pdf-name', readerState.pdfName);
    $('#reader-title').textContent = readerState.pdfName.length > 22 ? readerState.pdfName.slice(0, 22) + '…' : readerState.pdfName;
    $('#reader-welcome').classList.add('hidden');
    await renderAllPages(); buildSearchIndex(); restoreLastRead();
    rToast(`✅ ${pdf.numPages} pages`);
  } catch (err) {
    console.error(err); rToast('❌ Load failed');
  } finally {
    $('#reader-loading').classList.remove('show');
  }
}
async function renderAllPages() {
  const container = $('#reader-pages'); container.innerHTML = ''; readerState.pages = [];
  const viewerWidth = $('#reader-viewer').clientWidth - 16;
  const firstPage = await readerState.pdfDoc.getPage(1);
  const baseViewport = firstPage.getViewport({ scale: 1 });
  const fitScale = viewerWidth / baseViewport.width;
  const effectiveScale = fitScale * readerState.scale;
  for (let i = 1; i <= readerState.totalPages; i++) {
    const page = await readerState.pdfDoc.getPage(i);
    const viewport = page.getViewport({ scale: effectiveScale });
    const wrap = document.createElement('div'); wrap.className = 'pdf-page-wrap'; wrap.dataset.page = i;
    wrap.style.width = Math.round(viewport.width) + 'px';
    const pdfCanvas = document.createElement('canvas'); pdfCanvas.className = 'pdf-canvas';
    pdfCanvas.width = viewport.width; pdfCanvas.height = viewport.height;
    pdfCanvas.style.width = '100%'; pdfCanvas.style.height = 'auto'; wrap.appendChild(pdfCanvas);
    const drawCanvas = document.createElement('canvas'); drawCanvas.className = 'draw-canvas';
    drawCanvas.width = viewport.width; drawCanvas.height = viewport.height;
    drawCanvas.style.width = '100%'; drawCanvas.style.height = 'auto'; wrap.appendChild(drawCanvas);
    container.appendChild(wrap);
    readerState.pages.push({ num: i, pdfCanvas, drawCanvas, viewport });
    const ctx = pdfCanvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    const saved = readerState.annotations[readerState.pdfName + '_' + i];
    if (saved) { const img = new Image(); img.onload = () => drawCanvas.getContext('2d').drawImage(img, 0, 0); img.src = saved; }
    setupTouchDraw(drawCanvas, i);
  }
  setupScrollTracking();
}
function setupTouchDraw(canvas, pageNum) {
  const ctx = canvas.getContext('2d');
  const getPos = e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    const touch = e.touches ? e.touches[0] : e;
    return { x: (touch.clientX - rect.left) * scaleX, y: (touch.clientY - rect.top) * scaleY };
  };
  const start = e => {
    e.preventDefault();
    readerState.drawing = true;
    const { x, y } = getPos(e); readerState.lastX = x; readerState.lastY = y;
    if (readerState.tool === 'eraser') eraseAt(x, y, ctx, canvas);
    else {
      const key = readerState.pdfName + '_' + pageNum;
      if (!readerState.history[key]) readerState.history[key] = [];
      readerState.history[key].push(canvas.toDataURL());
    }
  };
  const move = e => {
    if (!readerState.drawing) return;
    e.preventDefault();
    const { x, y } = getPos(e);
    if (readerState.tool === 'eraser') eraseAt(x, y, ctx, canvas);
    else {
      ctx.globalAlpha = readerState.tool === 'highlight' ? 0.35 : 1;
      ctx.strokeStyle = readerState.color;
      ctx.lineWidth = (readerState.tool === 'highlight' ? readerState.size * 3 : readerState.size) * (canvas.width / canvas.getBoundingClientRect().width);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(readerState.lastX, readerState.lastY); ctx.lineTo(x, y); ctx.stroke();
      readerState.lastX = x; readerState.lastY = y;
    }
  };
  const end = () => { if (readerState.drawing) { readerState.drawing = false; saveAnnotations(canvas, pageNum); } };
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
}
function eraseAt(x, y, ctx, canvas) {
  const r = readerState.size * 4 * (canvas.width / canvas.getBoundingClientRect().width);
  ctx.save(); ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function saveAnnotations(canvas, pageNum) {
  const key = readerState.pdfName + '_' + pageNum;
  try { readerState.annotations[key] = canvas.toDataURL(); localStorage.setItem('reader-annotations', JSON.stringify(readerState.annotations)); }
  catch (e) { rToast('⚠️ Storage full'); }
}
function goToPage(n) {
  if (!readerState.pdfDoc || n < 1 || n > readerState.totalPages) return;
  readerState.currentPage = n;
  const page = readerState.pages.find(p => p.num === n);
  if (page) page.pdfCanvas.parentElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('#reader-prev').addEventListener('click', () => goToPage(readerState.currentPage - 1));
$('#reader-next').addEventListener('click', () => goToPage(readerState.currentPage + 1));
function setupScrollTracking() {
  const viewer = $('#reader-viewer');
  viewer.addEventListener('scroll', () => {
    const mid = viewer.scrollTop + viewer.clientHeight / 3;
    for (const page of readerState.pages) {
      const top = page.pdfCanvas.parentElement.offsetTop;
      const bottom = top + page.pdfCanvas.parentElement.offsetHeight;
      if (mid >= top && mid < bottom) { if (readerState.currentPage !== page.num) readerState.currentPage = page.num; break; }
    }
  }, { passive: true });
}
$$('[data-rtool]').forEach(btn => {
  btn.addEventListener('click', () => {
    readerState.tool = btn.dataset.rtool;
    $$('[data-rtool]').forEach(b => b.classList.toggle('active', b === btn));
    rToast(btn.dataset.rtool === 'pen' ? '✏️ Pen' : btn.dataset.rtool === 'highlight' ? '🖍️ Highlighter' : '🧽 Eraser');
  });
});
$('#reader-undo').addEventListener('click', () => {
  const key = readerState.pdfName + '_' + readerState.currentPage;
  if (!readerState.history[key]?.length) return rToast('Nothing to undo');
  const page = readerState.pages.find(p => p.num === readerState.currentPage);
  if (!page) return;
  const prev = readerState.history[key].pop();
  const img = new Image();
  img.onload = () => {
    const ctx = page.drawCanvas.getContext('2d');
    ctx.clearRect(0, 0, page.drawCanvas.width, page.drawCanvas.height);
    ctx.drawImage(img, 0, 0); saveAnnotations(page.drawCanvas, readerState.currentPage);
  };
  img.src = prev; rToast('↶ Undo');
});

$('#reader-add-bm').addEventListener('click', () => {
  if (!readerState.pdfDoc) return rToast('Open a PDF first');

function renderRBookmarks() {
  const list = $('#reader-bm-list');
  if (!readerState.bookmarks.length) { list.innerHTML = '<p style="text-align:center;color:var(--tx2);font-size:13px;padding:20px 0">No bookmarks yet</p>'; return; }
  list.innerHTML = readerState.bookmarks.map((bm,i) => `<div class="bm-item" data-page="${bm.page}"><span class="bm-page">${bm.page}</span><span>Page ${bm.page}</span><span class="bm-del" data-idx="${i}">✕</span></div>`).join('');
  list.querySelectorAll('.bm-item').forEach(item => {
    item.addEventListener('click', e => { if (e.target.classList.contains('bm-del')) return; closeRSheets(); goToPage(parseInt(item.dataset.page)); });
  });
  list.querySelectorAll('.bm-del').forEach(del => {
    del.addEventListener('click', e => { e.stopPropagation(); const idx = parseInt(del.dataset.idx); readerState.bookmarks.splice(idx, 1); localStorage.setItem('reader-bookmarks', JSON.stringify(readerState.bookmarks)); renderRBookmarks(); rToast('🗑️ Removed'); });
  });
}
let searchIndex = [];
async function buildSearchIndex() {
  if (!readerState.pdfDoc) return;
  searchIndex = [];
  const limit = Math.min(readerState.totalPages, 40);
  for (let i = 1; i <= limit; i++) {
    const page = await readerState.pdfDoc.getPage(i);
    const content = await page.getTextContent();
    searchIndex.push({ page: i, text: content.items.map(it => it.str).join(' ') });
  }
}
$('#reader-search-input').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const results = $('#reader-search-results');
  if (q.length < 2) { results.innerHTML = ''; return; }
  const hits = searchIndex.filter(p => p.text.toLowerCase().includes(q)).slice(0, 15);
  if (!hits.length) { results.innerHTML = '<p style="text-align:center;color:var(--tx2);font-size:13px;padding:20px 0">No results</p>'; return; }
  results.innerHTML = hits.map(h => {
    const idx = h.text.toLowerCase().indexOf(q);
    const snippet = h.text.substring(Math.max(0, idx - 30), idx + 60);
    const highlighted = snippet.replace(new RegExp(q, 'gi'), m => `<b>${m}</b>`);
    return `<div class="search-hit" data-page="${h.page}"><strong>Page ${h.page}</strong><br>${highlighted}</div>`;
  }).join('');
  results.querySelectorAll('.search-hit').forEach(hit => {
    hit.addEventListener('click', () => { closeRSheets(); goToPage(parseInt(hit.dataset.page)); });
  });
});
function restoreLastRead() {
  const last = localStorage.getItem('reader-last-page');
  if (last) { const p = parseInt(last); if (p >= 1 && p <= readerState.totalPages) setTimeout(() => goToPage(p), 600); }
  setInterval(() => { if (readerState.pdfDoc) localStorage.setItem('reader-last-page', readerState.currentPage); }, 3000);
}

const DB_NAME = 'boardprep-db', DB_STORE = 'pdfs';
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}
async function savePDFToDB(name, arrayBuffer, key = 'current-pdf') {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put({ name, data: arrayBuffer, savedAt: Date.now() }, key);
    return new Promise((resolve, reject) => { tx.oncomplete = () => resolve(true); tx.onerror = () => reject(tx.error); });
  } catch (e) { return false; }
}
async function loadPDFFromDB(key = 'current-pdf') {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    return new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result || null); req.onerror = () => reject(req.error); });
  } catch (e) { return null; }
}
async function deletePDFFromDB(key = 'current-pdf') {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    return new Promise(resolve => { tx.oncomplete = () => resolve(true); });
  } catch (e) { return false; }
}

let moveMode = false, pageZoom = 1, pageOffsetX = 0, pageOffsetY = 0;
let gestureStart = null, isDragging = false, dragStart = { x:0, y:0, offsetX:0, offsetY:0 };
function toggleMoveMode() {
  moveMode = !moveMode;
  const viewer = $('#reader-viewer'), pages = $('#reader-pages'), btn = $('#reader-move');
  if (moveMode) {
    viewer.classList.add('move-mode'); btn.classList.add('active');
    $$('[data-rtool]').forEach(b => { if (b.dataset.rtool) b.classList.remove('active'); });
    rToast('✋ Move mode — pinch to zoom, drag to pan');
  } else {
    viewer.classList.remove('move-mode'); btn.classList.remove('active');
    pages.style.transform = ''; pageZoom = 1; pageOffsetX = 0; pageOffsetY = 0;
    $$('[data-rtool]').forEach(b => { if (b.dataset.rtool === 'pen') b.classList.add('active'); });
    rToast('✏️ Draw mode');
  }
}
function applyTransform() { $('#reader-pages').style.transform = `translate(${pageOffsetX}px, ${pageOffsetY}px) scale(${pageZoom})`; }
function setupMoveGestures() {
  const viewer = $('#reader-viewer');
  viewer.addEventListener('touchstart', e => {
    if (!moveMode) return;
    if (e.touches.length === 2) {
      const [t1, t2] = e.touches;
      gestureStart = { dist: Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY), zoom: pageZoom };
    } else if (e.touches.length === 1) {
      isDragging = true;
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, offsetX: pageOffsetX, offsetY: pageOffsetY };
    }
  }, { passive: true });
  viewer.addEventListener('touchmove', e => {
    if (!moveMode) return;
    if (e.touches.length === 2 && gestureStart) {
      e.preventDefault();
      const [t1, t2] = e.touches;
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      pageZoom = Math.max(0.5, Math.min(5, gestureStart.zoom * (dist / gestureStart.dist)));
      applyTransform();
    } else if (e.touches.length === 1 && isDragging) {
      e.preventDefault();
      pageOffsetX = dragStart.offsetX + (e.touches[0].clientX - dragStart.x);
      pageOffsetY = dragStart.offsetY + (e.touches[0].clientY - dragStart.y);
      applyTransform();
    }
  }, { passive: false });
  viewer.addEventListener('touchend', e => {
    if (e.touches.length < 2) gestureStart = null;
    if (e.touches.length === 0) isDragging = false;
  });
}

let currentSubject = localStorage.getItem('reader-subject') || 'Physics';
function buildSubjectSelector() {
  const topbar = $('#reader-topbar');
  if ($('#subject-selector')) return;
  const sel = document.createElement('select');
  sel.id = 'subject-selector'; sel.className = 'subject-selector';
  Object.keys(SUBJECT_PDFS).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = SUBJECT_PDFS[name].label;
    if (name === currentSubject) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', e => {
    currentSubject = e.target.value;
    localStorage.setItem('reader-subject', currentSubject);
    loadSubject(currentSubject);
  });
  const title = $('#reader-title');
  title.parentNode.insertBefore(sel, title.nextSibling);
}
async function loadSubject(subjectName) {
  const meta = SUBJECT_PDFS[subjectName];
  if (!meta) return rToast('❌ Subject not configured');
  const pdfName = meta.label;
  const url = RELEASE_BASE + meta.file;
  const cacheKey = 'subject_' + subjectName;
  $('#reader-title').textContent = pdfName;
  localStorage.setItem('reader-pdf-name', pdfName);
  readerState.pdfName = pdfName; readerState.currentPage = 1;
  const cached = await loadPDFFromDB(cacheKey);
  if (cached && cached.data && cached.data.byteLength > 1000) {
    rToast('📂 Loading from cache…');
    setTimeout(() => loadPDF({ data: new Uint8Array(cached.data) }, pdfName), 200);
    return;
  }
  try {
    rToast('📥 Downloading ' + meta.label + '…');
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const total = parseInt(res.headers.get('content-length') || '0');
    const reader = res.body.getReader();
    const chunks = []; let received = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); received += value.length;
      if (total) rToast(`📥 ${meta.label}… ${Math.round((received/total)*100)}%`);
    }
    const totalLength = chunks.reduce((a,c) => a + c.length, 0);
    const arrayBuffer = new ArrayBuffer(totalLength);
    const view = new Uint8Array(arrayBuffer);
    let offset = 0;
    for (const chunk of chunks) { view.set(chunk, offset); offset += chunk.length; }
    rToast('💾 Saving for offline…');
    await savePDFToDB(pdfName, arrayBuffer, cacheKey);
    rToast('✅ ' + meta.label + ' ready!');
    loadPDF({ data: new Uint8Array(arrayBuffer) }, pdfName);
  } catch (err) {
    console.error(err);
    rToast('⚠️ Download failed.');
    $('#reader-welcome').classList.remove('hidden');
  }
}
$('#reader-move').addEventListener('click', toggleMoveMode);
$('#reader-clear-pdf').addEventListener('click', async () => {
  if (!confirm('Saved PDF aur annotations delete karne hain?')) return;
  await deletePDFFromDB('subject_' + currentSubject);

  localStorage.removeItem('reader-bookmarks');

  rToast('🗑️ Cleared ' + currentSubject);
  setTimeout(() => location.reload(), 600);
});

$('#reader-file').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  if (file.type !== 'application/pdf') return rToast('❌ PDF only');
  const reader = new FileReader();
  reader.onload = async () => {
    const arrayBuffer = reader.result;

    await savePDFToDB(file.name.replace('.pdf',''), arrayBuffer, 'subject_' + currentSubject);
    loadPDF({ data: new Uint8Array(arrayBuffer) }, file.name.replace('.pdf',''));
  };
  reader.readAsArrayBuffer(file);
});
